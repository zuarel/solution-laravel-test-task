name: markethub

x-php: &php
  build: .
  image: markethub-php:local
  working_dir: /app
  volumes:
    - .:/app
  init: true

services:
  app:
    <<: *php
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=60"]
    restart: unless-stopped
    stop_grace_period: 70s
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-markethub}
      POSTGRES_USER: ${DB_USERNAME:-markethub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-password}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  node:
    image: node:24-bookworm-slim
    profiles: [tools]
    working_dir: /app
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
    volumes:
      - .:/app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"

volumes:
  postgres-data:
